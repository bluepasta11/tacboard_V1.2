<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FC26 통합 택티컬 보드 Pro (index0819_2)</title>
  <style>
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: 'Pretendard', 'Noto Sans KR', sans-serif;
      user-select: none;
    }
    
    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #121214;
      color: #fff;
      display: flex;
    }

    /* 좌측 사이드바 */
    #sidebar {
      width: 320px;
      height: 100vh;
      background: #1e1e24;
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: 2px 0 10px rgba(0,0,0,0.5);
      z-index: 10;
      overflow-y: auto;
      flex-shrink: 0;
    }

    h2 { font-size: 1.1rem; color: #4cc9f0; margin-bottom: 2px; }
    .tool-group { display: flex; flex-direction: column; gap: 6px; background: #2b2d42; padding: 10px; border-radius: 8px; }
    .tool-group label { font-size: 0.78rem; color: #aaa; font-weight: bold; text-transform: uppercase; }
    
    button, select, input[type="color"] {
      padding: 8px 10px;
      border: none;
      border-radius: 6px;
      background: #4361ee;
      color: white;
      font-weight: bold;
      font-size: 0.82rem;
      cursor: pointer;
      transition: 0.2s;
    }
    button:hover, select:hover { background: #3f37c9; }
    button.active { background: #f72585 !important; }
    button.danger { background: #e63946; }

    .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .btn-grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }

    /* 단축키 안내 패널 */
    .shortcut-panel {
      background: #18181c;
      border: 1px solid #3d405b;
      border-radius: 8px;
      padding: 10px;
      font-size: 0.78rem;
      color: #ccc;
      line-height: 1.8;
    }
    .shortcut-panel h4 {
      color: #4cc9f0;
      font-size: 0.82rem;
      margin-bottom: 6px;
      border-bottom: 1px solid #3d405b;
      padding-bottom: 4px;
    }
    .shortcut-item {
      display: flex;
      justify-content: space-between;
      border-bottom: 1px dashed #2b2d42;
      padding: 2px 0;
    }
    .shortcut-item:last-child {
      border-bottom: none;
    }
    .shortcut-key {
      color: #ffb703;
      font-weight: bold;
    }

    /* 메인 영역 */
    #main-container {
      flex: 1;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: #0b0b0e;
      overflow: hidden;
      position: relative;
    }

    /* 상단 탭 스트립 */
    #tab-header {
      display: flex;
      background: #18181c;
      padding: 8px 15px 0 15px;
      gap: 5px;
      border-bottom: 2px solid #2b2d42;
      flex-shrink: 0;
      height: 48px;
      z-index: 6;
    }

    .tab-btn {
      padding: 8px 20px;
      background: #2b2d42;
      color: #aaa;
      border: none;
      border-top-left-radius: 8px;
      border-top-right-radius: 8px;
      font-size: 0.95rem;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    .tab-btn:hover { background: #3d405b; color: #fff; }
    .tab-btn.active { background: #4361ee; color: #fff; }

    /* 탭 콘텐츠 영역 */
    .tab-content {
      flex: 1;
      display: none;
      position: relative;
      overflow: hidden;
      justify-content: center;
      align-items: center;
    }

    .tab-content.active { display: flex; flex-direction: column; }

    /* 상단 리플레이 바 */
    #replay-bar {
      height: 48px;
      width: 100%;
      background: #18181c;
      border-bottom: 1px solid #2b2d42;
      display: flex;
      align-items: center;
      padding: 0 15px;
      gap: 12px;
      z-index: 5;
      flex-shrink: 0;
    }

    .replay-btn { background: #3d405b; padding: 6px 12px; display: inline-flex; align-items: center; gap: 4px; }
    .replay-btn:hover { background: #4361ee; }

    /* 보드 컨테이너 */
    #board-container, #note-container {
      position: relative;
      flex: 1;
      width: 100%;
      height: 100%;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      overflow: hidden;
      background: #1e1e24;
      display: flex;
      flex-direction: column;
    }

    /* 하단 전용 선수/공 추가 바 */
    #bottom-add-bar {
      height: 48px;
      width: 100%;
      background: #18181c;
      border-top: 1px solid #2b2d42;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 15px;
      gap: 12px;
      z-index: 5;
      flex-shrink: 0;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    /* 메모장 전용 에디터 및 서식 툴바 */
    #note-toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 15px;
      background: #2b2d42;
      border-bottom: 1px solid #3d405b;
      z-index: 3;
      flex-wrap: wrap;
    }

    #note-toolbar label { font-size: 0.78rem; color: #aaa; font-weight: bold; }
    
    .fmt-btn {
      padding: 6px 10px;
      background: #3d405b;
      font-weight: bold;
    }
    .fmt-btn:hover { background: #4361ee; }

    #fontSizeSelect {
      background: #3d405b;
      color: #fff;
      padding: 5px 8px;
      border: 1px solid #4cc9f0;
      outline: none;
    }

    .color-picker-wrapper {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #1e1e24;
      padding: 3px 8px;
      border-radius: 6px;
      border: 1px solid #3d405b;
    }
    .color-picker-wrapper input[type="color"] {
      -webkit-appearance: none;
      appearance: none;
      width: 24px;
      height: 24px;
      padding: 0;
      border: none;
      background: transparent;
      cursor: pointer;
    }

    #note-wrapper {
      position: relative;
      flex: 1;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    #full-tactic-note {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      padding: 20px;
      background: transparent;
      color: #fff;
      border: none;
      font-size: 36px;
      line-height: 1.5;
      outline: none;
      z-index: 1;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-word;
      user-select: text;
    }

    #full-tactic-note:empty:before {
      content: attr(data-placeholder);
      color: #777;
    }
  </style>
</head>
<body>

  <!-- 좌측 사이드바 -->
  <div id="sidebar">
    <h2>⚽ FC26 통합 보드 v1.2</h2>

    <!-- 1. 포메이션 프리셋 -->
    <div class="tool-group">
      <label>1. 포메이션 프리셋</label>
      <div class="btn-grid-3">
        <button onclick="applyFormation('433')">4-3-3</button>
        <button onclick="applyFormation('4231')">4-2-3-1</button>
        <button onclick="applyFormation('442')">4-4-2</button>
      </div>
      <div class="btn-grid-3">
        <button onclick="applyFormation('4141')">4-1-4-1</button>
        <button onclick="applyFormation('424')">4-2-4</button>
        <button onclick="applyFormation('352')">3-5-2</button>
      </div>
      <div class="btn-grid-3">
        <button onclick="applyFormation('343')">3-4-3</button>
        <button onclick="applyFormation('532')">5-3-2</button>
        <button onclick="applyFormation('541')">5-4-1</button>
      </div>
    </div>

    <!-- 2. 기본 도구 & 기능 -->
    <div class="tool-group">
      <label>2. 기본 도구 & 기능</label>
      <div class="btn-grid">
        <button id="mode-select" class="mode-btn active" onclick="setMode('select')">🖐️ 선택/이동 (1)</button>
        <button id="mode-eraser" class="mode-btn" onclick="setMode('eraser')">🧹 지우개 (3)</button>
      </div>
    </div>

    <!-- 3. 전술 공간 레이어 -->
    <div class="tool-group">
      <label>3. 전술 공간 레이어</label>
      <button id="btn-toggle-zones" onclick="toggleOverlay('zones')">🌐 구역 ON/OFF (Z)</button>
    </div>

    <!-- 4. 도형 & 드로잉 도구 -->
    <div class="tool-group">
      <label>4. 드로잉 & 자유 펜</label>
      <button id="mode-pen" class="mode-btn" style="background:#7209b7;" onclick="setMode('pen')">✏️ 자유 펜 (2)</button>
      <div class="btn-grid">
        <button id="mode-arrow" class="mode-btn" onclick="setMode('arrow')">➡️ 직선 이동</button>
        <button id="mode-dashed" class="mode-btn" onclick="setMode('dashed')">〰️ 땅볼 패스</button>
      </div>
      <div class="btn-grid">
        <button id="mode-lob" class="mode-btn" onclick="setMode('lob')">🌈 로빙 패스</button>
        <button id="mode-rect" class="mode-btn" onclick="setMode('rect')">🔲 사각형</button>
      </div>
      <button id="mode-circle" class="mode-btn" onclick="setMode('circle')">⚪ 원/타원</button>
    </div>

    <!-- 5. 단축키 안내 패널 -->
    <div class="shortcut-panel">
      <h4>💡 단축키 안내</h4>
      <div class="shortcut-item"><span>선택 / 이동</span><span class="shortcut-key">1</span></div>
      <div class="shortcut-item"><span>자유 펜</span><span class="shortcut-key">2</span></div>
      <div class="shortcut-item"><span>지우개</span><span class="shortcut-key">3</span></div>
      <div class="shortcut-item"><span>홈팀 드리블 이동</span><span class="shortcut-key">D + 이동</span></div>
      <div class="shortcut-item"><span>원정팀 드리블 이동</span><span class="shortcut-key">G + 이동</span></div>
      <div class="shortcut-item"><span>구역 ON / OFF</span><span class="shortcut-key">Z</span></div>
      <div class="shortcut-item"><span>전체 선 지우기</span><span class="shortcut-key">C</span></div>
      <div class="shortcut-item"><span>동선 초기화</span><span class="shortcut-key">X</span></div>
      <div class="shortcut-item"><span>작업 취소</span><span class="shortcut-key">Ctrl + Z</span></div>
      <div class="shortcut-item"><span>전체 초기화</span><span class="shortcut-key">T</span></div>
      <div class="shortcut-item"><span>애니메이션 재생/일시정지</span><span class="shortcut-key">Space</span></div>
      <div class="shortcut-item"><span>보드 ↔ 메모장 이동</span><span class="shortcut-key">Tab</span></div>
      <div class="shortcut-item"><span>애니메이션 동선 생성</span><span class="shortcut-key">Shift + 드래그</span></div>
    </div>

    <!-- 초기화 버튼 영역 -->
    <div class="tool-group" style="margin-top: auto;">
      <button onclick="clearPlayerPaths()" style="background:#f72585;">🔄 애니메이션 동선 초기화 (X)</button>
      <button onclick="clearDrawings()">🎨 전체 선 지우기 (C)</button>
      <button onclick="resetAll()" class="danger">🔄 전체 초기화 (T)</button>
    </div>
  </div>

  <!-- 메인 영역 -->
  <div id="main-container">
    <!-- 상단 탭 버튼 -->
    <div id="tab-header">
      <button class="tab-btn active" onclick="switchTab('board')">⚽ 전술 분석 보드</button>
      <button class="tab-btn" onclick="switchTab('note')">📝 전술 메모장</button>
    </div>

    <!-- 탭 1: 축구장 분석 보드 Pro -->
    <div id="tab-board" class="tab-content active">
      <!-- 상단 리플레이 바 -->
      <div id="replay-bar">
        <span style="font-size:0.85rem; font-weight:bold; color:#4cc9f0;">🎬 이동 애니메이션:</span>
        <button id="btn-play-pause" class="replay-btn" style="background:#4cc9f0; color:#000;" onclick="togglePlayPause()">
          <span id="play-icon">▶ 재생 (Space)</span>
          <span id="pause-icon" style="display:none;">❚❚ 일시정지</span>
        </button>
      </div>

      <div id="board-container">
        <canvas id="pitchCanvas"></canvas>
        <canvas id="overlayCanvas"></canvas>
        <canvas id="boardDrawCanvas"></canvas>
      </div>

      <!-- 하단 선수/공 추가 바 -->
      <div id="bottom-add-bar">
        <span style="font-size:0.85rem; font-weight:bold; color:#aaa;">➕ 필드요소 추가:</span>
        <button style="background:#4361ee;" onclick="addPlayer('blue')">🔵 홈팀 선수 추가</button>
        <button style="background:#e63946;" onclick="addPlayer('red')">🔴 원정팀 선수 추가</button>
        <button style="background:#ffb703; color:#000;" onclick="addBall()">⚽ 축구공 추가</button>
      </div>
    </div>

    <!-- 탭 2: 전술 메모장 -->
    <div id="tab-note" class="tab-content">
      <div id="note-container">
        <!-- 메모장 서식 툴바 -->
        <div id="note-toolbar">
          <label>글자 크기:</label>
          <button class="fmt-btn" onclick="changeFontSize(2)"><b>A+</b> 크게</button>
          <button class="fmt-btn" onclick="changeFontSize(-2)"><b>A-</b> 작게</button>

          <select id="fontSizeSelect" onchange="setFontSizeDirect(this.value)">
            <option value="18">18px</option>
            <option value="24">24px</option>
            <option value="30">30px</option>
            <option value="36" selected>36px (기본)</option>
            <option value="42">42px</option>
            <option value="48">48px</option>
            <option value="60">60px</option>
            <option value="72">72px</option>
          </select>

          <button class="fmt-btn" id="btn-bold" onclick="toggleBoldFormat()"><b>B</b> 굵게</button>

          <div class="color-picker-wrapper">
            <label>색상 선택:</label>
            <input type="color" id="activeColor" value="#ffeb3b">
          </div>

          <button class="fmt-btn" onclick="applyTextColorFromPalette()">글씨 색</button>
          <button class="fmt-btn" onclick="applyHighlightFromPalette()">형광펜</button>
          <button class="fmt-btn" style="padding: 6px 8px; font-size: 0.75rem;" onclick="clearTextBgColor()">형광펜 지우기</button>

          <label style="margin-left: 10px;">주석/기호 삽입:</label>
          <button class="fmt-btn" onclick="insertSymbol('1. ')">1. 숫자</button>
          <button class="fmt-btn" onclick="insertSymbol('• ')">• 불렛</button>
          <button class="fmt-btn" onclick="insertSymbol('// ')">// 주석</button>
          <button class="fmt-btn" onclick="insertSymbol('📌 ')">📌 핀</button>
        </div>

        <div id="note-wrapper">
          <div id="full-tactic-note" contenteditable="true" data-placeholder="전술 메모를 작성하세요..."></div>
          <canvas id="noteDrawCanvas" style="z-index: 2; pointer-events: none;"></canvas>
        </div>
      </div>
    </div>
  </div>

  <script>
    let W = 1200, H = 800;
    let activeTab = 'board';
    let currentMode = 'select';

    let showZones = false;
    let isDPressed = false;
    let isGPressed = false;

    let boardPlayers = [];
    let boardShapes = [];
    let noteShapes = [];

    let selectedPlayer = null;
    let isAnimating = false;
    let animReqId = null;

    let isDrawing = false;
    let isDragging = false;
    let startPos = { x: 0, y: 0 };

    const pitchCanvas = document.getElementById('pitchCanvas');
    const pitchCtx = pitchCanvas.getContext('2d');
    const overlayCanvas = document.getElementById('overlayCanvas');
    const overlayCtx = overlayCanvas.getContext('2d');
    const boardDrawCanvas = document.getElementById('boardDrawCanvas');
    const boardCtx = boardDrawCanvas.getContext('2d');

    const noteDrawCanvas = document.getElementById('noteDrawCanvas');
    const noteCtx = noteDrawCanvas.getContext('2d');
    const noteEditor = document.getElementById('full-tactic-note');

    /* 키보드 이벤트 (D, G 키 눌림 처리 및 단축키) */
    window.addEventListener('keydown', (e) => {
      if (document.activeElement === noteEditor || document.activeElement.tagName === 'INPUT' || document.activeElement.tagName === 'SELECT') {
        return;
      }

      if (e.key === 'd' || e.key === 'D') isDPressed = true;
      if (e.key === 'g' || e.key === 'G') isGPressed = true;

      if (e.key === 'x' || e.key === 'X') {
        clearPlayerPaths();
        return;
      }

      if (e.key === 't' || e.key === 'T') {
        resetAll();
        return;
      }

      if (e.key === 'Tab') {
        e.preventDefault();
        switchTab(activeTab === 'board' ? 'note' : 'board');
      }
      if (e.key === '1') setMode('select');
      if (e.key === '2') setMode('pen');
      if (e.key === '3') setMode('eraser');
      if (e.key === 'z' || e.key === 'Z') {
        if (!(e.ctrlKey || e.metaKey)) {
          toggleOverlay('zones');
        }
      }
      if (e.code === 'Space') {
        e.preventDefault();
        togglePlayPause();
      }
      if (e.key === 'c' || e.key === 'C') clearDrawings();
      if ((e.ctrlKey || e.metaKey) && (e.key === 'z' || e.key === 'Z')) {
        e.preventDefault();
        const shapes = getCurrentShapes();
        if (shapes.length > 0) shapes.pop();
        render();
      }
    });

    window.addEventListener('keyup', (e) => {
      if (e.key === 'd' || e.key === 'D') isDPressed = false;
      if (e.key === 'g' || e.key === 'G') isGPressed = false;
    });

    function getCurrentCtx() {
      return activeTab === 'board' ? boardCtx : noteCtx;
    }

    function getCurrentShapes() {
      return activeTab === 'board' ? boardShapes : noteShapes;
    }

    function resizeCanvases() {
      const container = document.getElementById('board-container');
      const prevW = W, prevH = H;
      
      W = container.clientWidth;
      H = container.clientHeight;

      [pitchCanvas, overlayCanvas, boardDrawCanvas, noteDrawCanvas].forEach(c => {
        c.width = W; c.height = H;
      });

      if (prevW > 0 && prevH > 0 && (prevW !== W || prevH !== H)) {
        const scaleX = W / prevW;
        const scaleY = H / prevH;
        boardPlayers.forEach(p => { 
          p.x *= scaleX; p.y *= scaleY; 
          if(p.path) p.path.forEach(pt => { pt.x *= scaleX; pt.y *= scaleY; });
        });
      }

      drawPitch();
      render();
    }
    window.addEventListener('resize', resizeCanvases);

    function switchTab(tabName) {
      activeTab = tabName;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

      if (tabName === 'board') {
        document.querySelectorAll('.tab-btn')[0].classList.add('active');
        document.getElementById('tab-board').classList.add('active');
        noteDrawCanvas.style.pointerEvents = 'none';
      } else {
        document.querySelectorAll('.tab-btn')[1].classList.add('active');
        document.getElementById('tab-note').classList.add('active');
        noteDrawCanvas.style.pointerEvents = (currentMode === 'select') ? 'none' : 'auto';
      }
      render();
    }

    function setMode(mode) {
      currentMode = mode;
      document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
      const activeBtn = document.getElementById(`mode-${mode}`);
      if (activeBtn) activeBtn.classList.add('active');

      if (activeTab === 'note') {
        noteDrawCanvas.style.pointerEvents = (currentMode === 'select') ? 'none' : 'auto';
      }
    }

    function addPlayer(team) {
      const count = boardPlayers.filter(p => p.team === team).length + 1;
      const offsetX = (Math.random() - 0.5) * 100;
      const offsetY = (Math.random() - 0.5) * 100;
      boardPlayers.push({
        id: Date.now() + Math.random(),
        x: W * 0.5 + offsetX,
        y: H * 0.5 + offsetY,
        team: team,
        label: String(count),
        path: []
      });
      render();
    }

    function addBall() {
      const offsetX = (Math.random() - 0.5) * 60;
      const offsetY = (Math.random() - 0.5) * 60;
      boardPlayers.push({
        id: Date.now() + Math.random(),
        x: W * 0.5 + offsetX,
        y: H * 0.5 + offsetY,
        team: 'ball',
        label: '⚽',
        path: []
      });
      render();
    }

    function initDefault1v1() {
      boardPlayers = [
        { id: 1, x: W * 0.4, y: H * 0.5, team: 'blue', label: '1', path: [] },
        { id: 2, x: W * 0.6, y: H * 0.5, team: 'red', label: '1', path: [] },
        { id: 3, x: W * 0.4 + 25, y: H * 0.5, team: 'ball', label: '⚽', path: [] }
      ];
      boardShapes = [];
      render();
    }

    function applyFormation(type) {
      if (activeTab !== 'board') switchTab('board');
      boardPlayers = [];
      boardShapes = [];

      const formPos = {
        '433': [
          {x:0.08, y:0.5}, {x:0.22, y:0.18}, {x:0.2, y:0.38}, {x:0.2, y:0.62}, {x:0.22, y:0.82},
          {x:0.35, y:0.5}, {x:0.45, y:0.32}, {x:0.45, y:0.68},
          {x:0.7, y:0.2}, {x:0.75, y:0.5}, {x:0.7, y:0.8}
        ],
        '4231': [
          {x:0.08, y:0.5}, {x:0.22, y:0.18}, {x:0.2, y:0.38}, {x:0.2, y:0.62}, {x:0.22, y:0.82},
          {x:0.38, y:0.38}, {x:0.38, y:0.62},
          {x:0.58, y:0.2}, {x:0.58, y:0.5}, {x:0.58, y:0.8},
          {x:0.78, y:0.5}
        ],
        '442': [
          {x:0.08, y:0.5}, {x:0.22, y:0.18}, {x:0.2, y:0.38}, {x:0.2, y:0.62}, {x:0.22, y:0.82},
          {x:0.45, y:0.18}, {x:0.42, y:0.38}, {x:0.42, y:0.62}, {x:0.45, y:0.85},
          {x:0.72, y:0.38}, {x:0.72, y:0.62}
        ],
        '4141': [
          {x:0.08, y:0.5}, {x:0.22, y:0.18}, {x:0.2, y:0.38}, {x:0.2, y:0.62}, {x:0.22, y:0.82},
          {x:0.34, y:0.5},
          {x:0.52, y:0.18}, {x:0.5, y:0.38}, {x:0.5, y:0.62}, {x:0.52, y:0.82},
          {x:0.75, y:0.5}
        ],
        '424': [
          {x:0.08, y:0.5}, {x:0.22, y:0.18}, {x:0.2, y:0.38}, {x:0.2, y:0.62}, {x:0.22, y:0.82},
          {x:0.42, y:0.38}, {x:0.42, y:0.62},
          {x:0.72, y:0.18}, {x:0.75, y:0.38}, {x:0.75, y:0.62}, {x:0.72, y:0.82}
        ],
        '352': [
          {x:0.08, y:0.5}, {x:0.2, y:0.25}, {x:0.2, y:0.5}, {x:0.2, y:0.75},
          {x:0.45, y:0.15}, {x:0.38, y:0.35}, {x:0.42, y:0.5}, {x:0.38, y:0.65}, {x:0.45, y:0.85},
          {x:0.72, y:0.38}, {x:0.72, y:0.62}
        ],
        '343': [
          {x:0.08, y:0.5}, {x:0.2, y:0.25}, {x:0.2, y:0.5}, {x:0.2, y:0.75},
          {x:0.45, y:0.18}, {x:0.42, y:0.38}, {x:0.42, y:0.62}, {x:0.45, y:0.82},
          {x:0.72, y:0.22}, {x:0.75, y:0.5}, {x:0.72, y:0.78}
        ],
        '532': [
          {x:0.08, y:0.5}, {x:0.22, y:0.15}, {x:0.18, y:0.32}, {x:0.18, y:0.5}, {x:0.18, y:0.68}, {x:0.22, y:0.85},
          {x:0.42, y:0.3}, {x:0.4, y:0.5}, {x:0.42, y:0.7},
          {x:0.72, y:0.38}, {x:0.72, y:0.62}
        ],
        '541': [
          {x:0.08, y:0.5}, {x:0.22, y:0.15}, {x:0.18, y:0.32}, {x:0.18, y:0.5}, {x:0.18, y:0.68}, {x:0.22, y:0.85},
          {x:0.45, y:0.18}, {x:0.42, y:0.38}, {x:0.42, y:0.62}, {x:0.45, y:0.82},
          {x:0.75, y:0.5}
        ]
      };

      const coords = formPos[type] || formPos['433'];
      coords.forEach((c, idx) => {
        boardPlayers.push({
          id: Date.now() + Math.random(),
          x: W * c.x, y: H * c.y, team: 'blue',
          label: idx === 0 ? 'GK' : String(idx + 1), path: []
        });
      });

      boardPlayers.push({ id: Date.now() + Math.random(), x: W * 0.45, y: H * 0.5, team: 'ball', label: '⚽', path: [] });
      render();
    }

    function drawPitch() {
      pitchCtx.fillStyle = '#2d6a4f';
      pitchCtx.fillRect(0, 0, W, H);

      pitchCtx.fillStyle = '#245a42';
      const stripeW = W / 10;
      for (let i = 0; i < W; i += stripeW) {
        if (Math.floor(i / stripeW) % 2 === 0) pitchCtx.fillRect(i, 0, stripeW, H);
      }

      pitchCtx.strokeStyle = 'rgba(255, 255, 255, 0.8)';
      pitchCtx.lineWidth = 3;

      const m = 20;
      pitchCtx.strokeRect(m, m, W - m * 2, H - m * 2);

      pitchCtx.beginPath();
      pitchCtx.moveTo(W / 2, m);
      pitchCtx.lineTo(W / 2, H - m);
      pitchCtx.stroke();

      pitchCtx.beginPath();
      pitchCtx.arc(W / 2, H / 2, H * 0.15, 0, Math.PI * 2);
      pitchCtx.stroke();

      const boxH = H * 0.5;
      const boxW = W * 0.15;
      pitchCtx.strokeRect(m, H / 2 - boxH / 2, boxW, boxH);
      pitchCtx.strokeRect(W - m - boxW, H / 2 - boxH / 2, boxW, boxH);
    }

    function renderOverlays() {
      overlayCtx.clearRect(0, 0, W, H);
      if (activeTab !== 'board') return;

      if (showZones) {
        overlayCtx.strokeStyle = 'rgba(76, 201, 240, 0.4)';
        overlayCtx.lineWidth = 2;
        overlayCtx.setLineDash([6, 6]);

        const cols = 6, rows = 3;
        const cW = W / cols, rH = H / rows;

        for (let i = 1; i < cols; i++) {
          overlayCtx.beginPath(); overlayCtx.moveTo(i * cW, 0); overlayCtx.lineTo(i * cW, H); overlayCtx.stroke();
        }
        for (let j = 1; j < rows; j++) {
          overlayCtx.beginPath(); overlayCtx.moveTo(0, j * rH); overlayCtx.lineTo(W, j * rH); overlayCtx.stroke();
        }
        overlayCtx.setLineDash([]);
      }
    }

    function toggleOverlay(type) {
      if (type === 'zones') {
        showZones = !showZones;
        document.getElementById('btn-toggle-zones').classList.toggle('active', showZones);
      }
      renderOverlays();
    }

    function render() {
      const ctx = getCurrentCtx();
      ctx.clearRect(0, 0, W, H);

      renderOverlays();

      if (activeTab === 'board') {
        boardPlayers.forEach(p => {
          if (p.path && p.path.length > 1) {
            ctx.beginPath();
            ctx.strokeStyle = p.team === 'blue' ? 'rgba(67, 97, 238, 0.6)' : (p.team === 'red' ? 'rgba(230, 57, 70, 0.6)' : 'rgba(255, 183, 3, 0.8)');
            ctx.lineWidth = p.team === 'ball' ? 2 : 3;
            ctx.setLineDash(p.team === 'ball' ? [2, 2] : [4, 4]);
            p.path.forEach((pt, i) => {
              if (i === 0) ctx.moveTo(pt.x, pt.y);
              else ctx.lineTo(pt.x, pt.y);
            });
            ctx.stroke();
            ctx.setLineDash([]);
          }
        });
      }

      const shapes = getCurrentShapes();
      shapes.forEach(s => {
        ctx.strokeStyle = s.color || '#ffea00';
        ctx.lineWidth = 3;
        ctx.setLineDash([]);

        if (s.type === 'pen') {
          ctx.beginPath();
          s.points.forEach((pt, i) => {
            if (i === 0) ctx.moveTo(pt.x, pt.y);
            else ctx.lineTo(pt.x, pt.y);
          });
          ctx.stroke();
        } else if (s.type === 'arrow') {
          drawArrow(ctx, s.x1, s.y1, s.x2, s.y2);
        } else if (s.type === 'dashed') {
          ctx.setLineDash([8, 5]);
          drawArrow(ctx, s.x1, s.y1, s.x2, s.y2);
          ctx.setLineDash([]);
        } else if (s.type === 'lob') {
          ctx.setLineDash([6, 4]);
          drawLobPass(ctx, s.x1, s.y1, s.x2, s.y2);
          ctx.setLineDash([]);
        } else if (s.type === 'rect') {
          ctx.strokeRect(s.x, s.y, s.w, s.h);
        } else if (s.type === 'circle') {
          ctx.beginPath();
          ctx.ellipse(s.cx, s.cy, Math.abs(s.rx), Math.abs(s.ry), 0, 0, Math.PI * 2);
          ctx.stroke();
        }
      });

      if (activeTab === 'board') {
        boardPlayers.forEach(p => {
          const radius = p.team === 'ball' ? 14 : 20;

          if (p === selectedPlayer) {
            ctx.beginPath();
            ctx.arc(p.x, p.y, radius + 5, 0, Math.PI * 2);
            ctx.strokeStyle = '#4cc9f0';
            ctx.lineWidth = 3;
            ctx.stroke();
          }

          ctx.beginPath();
          ctx.arc(p.x, p.y, radius, 0, Math.PI * 2);
          ctx.fillStyle = p.team === 'blue' ? '#4361ee' : (p.team === 'red' ? '#e63946' : '#ffb703');
          ctx.fill();
          ctx.strokeStyle = '#fff';
          ctx.lineWidth = 2;
          ctx.stroke();

          ctx.fillStyle = p.team === 'ball' ? '#000' : '#fff';
          ctx.font = 'bold 14px Pretendard';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(p.label, p.x, p.y);
        });
      }
    }

    function drawArrow(ctx, x1, y1, x2, y2) {
      const head = 15;
      const angle = Math.atan2(y2 - y1, x2 - x1);
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(x2, y2);
      ctx.lineTo(x2 - head * Math.cos(angle - Math.PI / 6), y2 - head * Math.sin(angle - Math.PI / 6));
      ctx.lineTo(x2 - head * Math.cos(angle + Math.PI / 6), y2 - head * Math.sin(angle + Math.PI / 6));
      ctx.fillStyle = ctx.strokeStyle;
      ctx.fill();
    }

    function drawLobPass(ctx, x1, y1, x2, y2) {
      const midX = (x1 + x2) / 2;
      const midY = (y1 + y2) / 2 - Math.hypot(x2 - x1, y2 - y1) * 0.25;
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.quadraticCurveTo(midX, midY, x2, y2);
      ctx.stroke();

      const angle = Math.atan2(y2 - midY, x2 - midX);
      const head = 14;
      ctx.beginPath();
      ctx.moveTo(x2, y2);
      ctx.lineTo(x2 - head * Math.cos(angle - Math.PI / 6), y2 - head * Math.sin(angle - Math.PI / 6));
      ctx.lineTo(x2 - head * Math.cos(angle + Math.PI / 6), y2 - head * Math.sin(angle + Math.PI / 6));
      ctx.fillStyle = ctx.strokeStyle;
      ctx.fill();
    }

    function getCanvasCoords(canvas, e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches && e.touches.length > 0 ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches && e.touches.length > 0 ? e.touches[0].clientY : e.clientY;
      return { x: clientX - rect.left, y: clientY - rect.top };
    }

    function checkErase(x, y) {
      let erased = false;
      if (activeTab === 'board') {
        const pLen = boardPlayers.length;
        boardPlayers = boardPlayers.filter(p => Math.hypot(p.x - x, p.y - y) > 25);
        if (boardPlayers.length !== pLen) erased = true;

        const sLen = boardShapes.length;
        boardShapes = boardShapes.filter(s => {
          if (s.type === 'pen') {
            return !s.points.some(pt => Math.hypot(pt.x - x, pt.y - y) < 20);
          } else if (s.type === 'arrow' || s.type === 'dashed' || s.type === 'lob') {
            return Math.hypot(s.x1 - x, s.y1 - y) > 20 && Math.hypot(s.x2 - x, s.y2 - y) > 20;
          } else if (s.type === 'rect') {
            return !(x >= s.x && x <= s.x + s.w && y >= s.y && y <= s.y + s.h);
          } else if (s.type === 'circle') {
            return Math.hypot(s.cx - x, s.cy - y) > s.rx;
          }
          return true;
        });
        if (boardShapes.length !== sLen) erased = true;
      } else {
        const sLen = noteShapes.length;
        noteShapes = noteShapes.filter(s => {
          if (s.type === 'pen') {
            return !s.points.some(pt => Math.hypot(pt.x - x, pt.y - y) < 20);
          }
          return true;
        });
        if (noteShapes.length !== sLen) erased = true;
      }
      if (erased) render();
    }

    function calculateTargetDribblePosition(player, newX, newY) {
      const dx = newX - player.x;
      const dy = newY - player.y;
      const dist = Math.hypot(dx, dy);

      if (dist < 0.5) return null;

      const angle = Math.atan2(dy, dx);
      const dribbleCycle = (player.dribbleStep || 0) + dist * 0.12;
      player.dribbleStep = dribbleCycle;

      const sideStep = Math.sin(dribbleCycle) * 6;
      const forwardOffset = 18 + Math.abs(Math.sin(dribbleCycle)) * 4;

      const targetX = newX + Math.cos(angle) * forwardOffset - Math.sin(angle) * sideStep;
      const targetY = newY + Math.sin(angle) * forwardOffset + Math.cos(angle) * sideStep;

      return { x: targetX, y: targetY };
    }

    function bindCanvasEvents(canvas) {
      const handleStart = (e) => {
        if (isAnimating) return;
        const { x, y } = getCanvasCoords(canvas, e);
        startPos = { x, y };

        if (currentMode === 'select') {
          if (activeTab === 'board') {
            const p = boardPlayers.find(pt => Math.hypot(pt.x - x, pt.y - y) < 25);
            if (p) {
              selectedPlayer = p;
              isDragging = true;
              
              if (!p.path) p.path = [];

              const isBlueDribble = isDPressed && p.team === 'blue';
              const isRedDribble = isGPressed && p.team === 'red';

              if (isBlueDribble || isRedDribble) {
                const balls = boardPlayers.filter(b => b.team === 'ball');
                if (balls.length > 0) {
                  let nearestBall = balls[0];
                  let minDistance = Math.hypot(balls[0].x - x, balls[0].y - y);
                  balls.forEach(b => {
                    const d = Math.hypot(b.x - x, b.y - y);
                    if (d < minDistance) { minDistance = d; nearestBall = b; }
                  });
                  
                  p.attachedBall = nearestBall;
                  p.dribbleStep = 0;

                  if (!nearestBall.path) nearestBall.path = [];

                  const targetPos = calculateTargetDribblePosition(p, x + 5, y);
                  if (targetPos) {
                    nearestBall.x = targetPos.x;
                    nearestBall.y = targetPos.y;
                  }
                }
              }
              render();
              return;
            }
          }
          selectedPlayer = null;
          render();
          return;
        }

        if (currentMode === 'eraser') {
          isDrawing = true;
          checkErase(x, y);
          return;
        }

        isDrawing = true;
        const shapes = getCurrentShapes();

        if (currentMode === 'pen') {
          shapes.push({ type: 'pen', points: [{ x, y }], color: '#ffea00' });
        } else if (['arrow', 'dashed', 'lob'].includes(currentMode)) {
          shapes.push({ type: currentMode, x1: x, y1: y, x2: x, y2: y, color: '#ffea00' });
        } else if (currentMode === 'rect') {
          shapes.push({ type: 'rect', x, y, w: 0, h: 0, color: '#ffea00' });
        } else if (currentMode === 'circle') {
          shapes.push({ type: 'circle', cx: x, cy: y, rx: 0, ry: 0, color: '#ffea00' });
        }
      };

      const handleMove = (e) => {
        if (isAnimating) return;
        const { x, y } = getCanvasCoords(canvas, e);

        if (currentMode === 'eraser' && isDrawing) {
          checkErase(x, y);
          return;
        }

        if (isDragging && selectedPlayer && activeTab === 'board') {
          const isBlueDribble = isDPressed && selectedPlayer.team === 'blue';
          const isRedDribble = isGPressed && selectedPlayer.team === 'red';

          if ((isBlueDribble || isRedDribble) && selectedPlayer.attachedBall) {
            const ball = selectedPlayer.attachedBall;
            const targetPos = calculateTargetDribblePosition(selectedPlayer, x, y);
            
            if (targetPos) {
              const smoothFactor = 0.35;
              ball.x += (targetPos.x - ball.x) * smoothFactor;
              ball.y += (targetPos.y - ball.y) * smoothFactor;

              if (e.shiftKey) {
                if (!ball.path) ball.path = [];
                ball.path.push({ x: ball.x, y: ball.y });
              }
            }
          }

          selectedPlayer.x = x;
          selectedPlayer.y = y;
          
          if (e.shiftKey) {
            if (!selectedPlayer.path) selectedPlayer.path = [];
            selectedPlayer.path.push({ x, y });
          }

          render();
          return;
        }

        if (isDrawing) {
          const shapes = getCurrentShapes();
          const currentShape = shapes[shapes.length - 1];
          if (!currentShape) return;

          if (currentMode === 'pen') {
            currentShape.points.push({ x, y });
          } else if (['arrow', 'dashed', 'lob'].includes(currentMode)) {
            currentShape.x2 = x;
            currentShape.y2 = y;
          } else if (currentMode === 'rect') {
            currentShape.x = Math.min(startPos.x, x);
            currentShape.y = Math.min(startPos.y, y);
            currentShape.w = Math.abs(x - startPos.x);
            currentShape.h = Math.abs(y - startPos.y);
          } else if (currentMode === 'circle') {
            currentShape.cx = (startPos.x + x) / 2;
            currentShape.cy = (startPos.y + y) / 2;
            currentShape.rx = Math.abs(x - startPos.x) / 2;
            currentShape.ry = Math.abs(y - startPos.y) / 2;
          }
          render();
        }
      };

      const handleEnd = () => {
        if (selectedPlayer && selectedPlayer.attachedBall) {
          selectedPlayer.attachedBall = null;
        }
        isDragging = false;
        isDrawing = false;
        render();
      };

      canvas.addEventListener('mousedown', handleStart);
      canvas.addEventListener('mousemove', handleMove);
      canvas.addEventListener('mouseup', handleEnd);

      canvas.addEventListener('touchstart', (e) => { handleStart(e); e.preventDefault(); }, { passive: false });
      canvas.addEventListener('touchmove', (e) => { handleMove(e); e.preventDefault(); }, { passive: false });
      canvas.addEventListener('touchend', (e) => { handleEnd(e); }, { passive: false });
    }

    bindCanvasEvents(boardDrawCanvas);

    function togglePlayPause() {
      if (isAnimating) pauseAnimation();
      else playAnimation();
    }

    function pauseAnimation() {
      isAnimating = false;
      if (animReqId) cancelAnimationFrame(animReqId);
      document.getElementById('play-icon').style.display = 'inline';
      document.getElementById('pause-icon').style.display = 'none';
      render();
    }

    function playAnimation() {
      isAnimating = true;
      document.getElementById('play-icon').style.display = 'none';
      document.getElementById('pause-icon').style.display = 'inline';

      let stepIdx = 0;
      const speedFactor = 0.43;

      function step() {
        if (!isAnimating) return;

        let hasMoreSteps = false;

        boardPlayers.forEach(p => {
          if (p.path && p.path.length > 0) {
            const currentFloatIdx = stepIdx * speedFactor;
            const idx1 = Math.floor(currentFloatIdx);
            const idx2 = Math.min(idx1 + 1, p.path.length - 1);
            const ratio = currentFloatIdx - idx1;

            if (idx1 < p.path.length - 1) {
              p.x = p.path[idx1].x + (p.path[idx2].x - p.path[idx1].x) * ratio;
              p.y = p.path[idx1].y + (p.path[idx2].y - p.path[idx1].y) * ratio;
              hasMoreSteps = true;
            } else {
              p.x = p.path[p.path.length - 1].x;
              p.y = p.path[p.path.length - 1].y;
            }
          }
        });

        render();
        stepIdx++;

        if (hasMoreSteps) {
          animReqId = requestAnimationFrame(step);
        } else {
          pauseAnimation();
        }
      }
      animReqId = requestAnimationFrame(step);
    }

    function clearPlayerPaths() {
      boardPlayers.forEach(p => { p.path = []; });
      render();
    }

    function clearDrawings() {
      if (activeTab === 'board') boardShapes = [];
      else noteShapes = [];
      render();
    }

    function resetAll() {
      initDefault1v1();
    }

    setTimeout(() => {
      resizeCanvases();
      initDefault1v1();
    }, 50);
  </script>
